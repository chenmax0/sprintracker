ticket_create:
    path: /api/projects/{projectId}/tickets
    controller: App\Ticket\Infrastructure\Symfony\Controllers\TicketController::create
    methods: [POST]

ticket_list:
    path: /api/projects/{projectId}/tickets
    controller: App\Ticket\Infrastructure\Symfony\Controllers\TicketController::list
    methods: [GET]

ticket_show:
    path: /api/tickets/{ticketId}
    controller: App\Ticket\Infrastructure\Symfony\Controllers\TicketController::show
    methods: [GET]

ticket_assign:
    path: /api/tickets/{ticketId}/assign
    controller: App\Ticket\Infrastructure\Symfony\Controllers\TicketController::assign
    methods: [POST]

ticket_update_status:
    path: /api/tickets/{ticketId}/status
    controller: App\Ticket\Infrastructure\Symfony\Controllers\TicketController::updateStatus
    methods: [PATCH]

ticket_add_comment:
    path: /api/tickets/{ticketId}/comments
    controller: App\Ticket\Infrastructure\Symfony\Controllers\TicketController::addComment
    methods: [POST]

ticket_list_comments:
    path: /api/tickets/{ticketId}/comments
    controller: App\Ticket\Infrastructure\Symfony\Controllers\TicketController::listComments
    methods: [GET]
