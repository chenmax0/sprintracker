project_create:
    path: /api/teams/{teamId}/projects
    controller: App\Project\Infrastructure\Symfony\Controllers\ProjectController::create
    methods: [POST]

project_list:
    path: /api/teams/{teamId}/projects
    controller: App\Project\Infrastructure\Symfony\Controllers\ProjectController::list
    methods: [GET]

project_create_with_team:
    path: /api/projects
    controller: App\Project\Infrastructure\Symfony\Controllers\ProjectController::createWithTeam
    methods: [POST]

project_list_mine:
    path: /api/projects
    controller: App\Project\Infrastructure\Symfony\Controllers\ProjectController::listMine
    methods: [GET]

project_show:
    path: /api/projects/{projectId}
    controller: App\Project\Infrastructure\Symfony\Controllers\ProjectController::show
    methods: [GET]

project_rename:
    path: /api/projects/{projectId}
    controller: App\Project\Infrastructure\Symfony\Controllers\ProjectController::rename
    methods: [PATCH]

project_delete:
    path: /api/projects/{projectId}
    controller: App\Project\Infrastructure\Symfony\Controllers\ProjectController::delete
    methods: [DELETE]
