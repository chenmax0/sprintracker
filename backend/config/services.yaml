# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    demo_team_id: '%env(DEMO_TEAM_ID)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Kernel.php'
            - '../src/*/Domain/'

    # Controllers referenced by FQCN in Infrastructure/Symfony/Routes/*.yaml files need this tag
    # to have their action arguments (beyond Request) resolved from the container.
    App\Auth\Infrastructure\Symfony\Controllers\:
        resource: '../src/Auth/Infrastructure/Symfony/Controllers/'
        tags: ['controller.service_arguments']

    App\Team\Infrastructure\Symfony\Controllers\:
        resource: '../src/Team/Infrastructure/Symfony/Controllers/'
        tags: ['controller.service_arguments']

    App\Project\Infrastructure\Symfony\Controllers\:
        resource: '../src/Project/Infrastructure/Symfony/Controllers/'
        tags: ['controller.service_arguments']

    App\Sprint\Infrastructure\Symfony\Controllers\:
        resource: '../src/Sprint/Infrastructure/Symfony/Controllers/'
        tags: ['controller.service_arguments']

    App\Ticket\Infrastructure\Symfony\Controllers\:
        resource: '../src/Ticket/Infrastructure/Symfony/Controllers/'
        tags: ['controller.service_arguments']

    App\Demo\Infrastructure\Symfony\Controllers\:
        resource: '../src/Demo/Infrastructure/Symfony/Controllers/'
        tags: ['controller.service_arguments']

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Auth\Domain\UserRepositoryInterface:
        alias: App\Auth\Infrastructure\Persistence\Sql\SqlUserRepository

    App\Auth\Application\Port\PasswordHasherInterface:
        alias: App\Auth\Infrastructure\Security\SymfonyPasswordHasher

    App\Team\Domain\TeamRepositoryInterface:
        alias: App\Team\Infrastructure\Persistence\Sql\SqlTeamRepository

    App\Team\Domain\TeamMembershipRepositoryInterface:
        alias: App\Team\Infrastructure\Persistence\Sql\SqlTeamMembershipRepository

    App\Team\Application\Port\UserLookupInterface:
        alias: App\Team\Infrastructure\Persistence\Sql\SqlUserLookup

    App\Team\Application\Port\UserProfileLookupInterface:
        alias: App\Team\Infrastructure\Persistence\Sql\SqlUserProfileLookup

    App\Project\Domain\ProjectRepositoryInterface:
        alias: App\Project\Infrastructure\Persistence\Sql\SqlProjectRepository

    App\Project\Application\Port\TeamOwnershipCheckerInterface:
        alias: App\Project\Infrastructure\Persistence\Sql\SqlTeamOwnershipChecker

    App\Project\Application\Port\TeamMembershipCheckerInterface:
        alias: App\Project\Infrastructure\Persistence\Sql\SqlTeamMembershipChecker

    App\Sprint\Domain\SprintRepositoryInterface:
        alias: App\Sprint\Infrastructure\Persistence\Sql\SqlSprintRepository

    App\Sprint\Application\Port\ProjectTeamMembershipCheckerInterface:
        alias: App\Sprint\Infrastructure\Persistence\Sql\SqlProjectTeamMembershipChecker

    App\Ticket\Domain\TicketRepositoryInterface:
        alias: App\Ticket\Infrastructure\Persistence\Sql\SqlTicketRepository

    App\Ticket\Domain\CommentRepositoryInterface:
        alias: App\Ticket\Infrastructure\Persistence\Sql\SqlCommentRepository

    App\Ticket\Application\Port\ProjectTeamMembershipCheckerInterface:
        alias: App\Ticket\Infrastructure\Persistence\Sql\SqlProjectTeamMembershipChecker

    App\Ticket\Application\Port\SprintLookupInterface:
        alias: App\Ticket\Infrastructure\Persistence\Sql\SqlSprintLookup

    App\Demo\Application\Port\DemoRepositoryInterface:
        alias: App\Demo\Infrastructure\Persistence\Sql\SqlDemoRepository

    App\Demo\Infrastructure\Persistence\Sql\SqlDemoRepository:
        arguments:
            $demoTeamId: '%demo_team_id%'
